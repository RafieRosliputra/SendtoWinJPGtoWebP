name: build-windows
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --console --name jpg2webp jpg2webp.py
      - name: ffmpeg (BtbN GPL build, ada hevc_nvenc + libx265)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          $bin = Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName dist/
          Copy-Item (Join-Path $bin.DirectoryName ffprobe.exe) dist/
          Compress-Archive dist/ffmpeg.exe, dist/ffprobe.exe ffmpeg-win64.zip
      - name: smoke test (gambar + video, fallback x265 sebab runner tiada GPU)
        shell: pwsh
        run: |
          python -c "from PIL import Image; im=Image.new('RGB',(64,32)); e=im.getexif(); e[0x0112]=6; im.save('t.jpg', exif=e.tobytes())"
          New-Item -ItemType Directory smoke | Out-Null; Move-Item t.jpg smoke/
          dist/jpg2webp.exe smoke --no-pause
          if (!(Test-Path smoke/t.webp) -or !(Test-Path smoke/_JPG/t.jpg)) { exit 1 }
          dist/ffmpeg.exe -v error -f lavfi -i testsrc2=s=640x360:r=30:d=3 -f lavfi -i sine=d=3 -c:v libx264 -b:v 15M -c:a aac smoke/v.mp4
          dist/jpg2webp.exe --video smoke --no-pause
          if (!(Test-Path smoke/_MP4/v.mp4)) { exit 1 }
          dist/ffprobe.exe -v error -show_entries stream=codec_name,pix_fmt -of compact smoke/v.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: jpg2webp
          path: |
            dist/jpg2webp.exe
            ffmpeg-win64.zip
      - name: release (latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest build
          prerelease: true
          files: |
            dist/jpg2webp.exe
            ffmpeg-win64.zip
